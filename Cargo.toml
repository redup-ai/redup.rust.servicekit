[package]
name = "redup-servicekit"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["REDUP"]
license = "MIT"
description = "Toolkit for Rust microservices: YAML configuration, JSON logging, Prometheus metrics and gRPC utilities"
repository = "https://github.com/redup-ai/redup.rust.servicekit"
homepage = "https://github.com/redup-ai/redup.rust.servicekit"
readme = "README.md"
keywords = ["servicekit", "grpc", "prometheus", "metrics", "monitoring"]
categories = ["development-tools", "web-programming"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
chrono = "0.4"
prometheus = "0.13"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tower = { version = "0.4", features = ["util"] }
tower-layer = "0.3"
tower-service = "0.3"
http = "1"
http-body = "1"
tonic = { version = "0.12", features = ["gzip"] }
tonic-health = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"

[dev-dependencies]
hyper = "1"
http-body-util = "0.1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1